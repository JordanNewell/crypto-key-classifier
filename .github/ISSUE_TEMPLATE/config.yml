blank_issues_enabled: false
contact_links:
  - name: Security report
    url: https://github.com/JordanNewell/crypto-key-classifier/blob/main/SECURITY.md
    about: |
      Security-sensitive bugs (masking bypass, key leakage, output format
      issues that could expose key material). Do NOT use public issues —
      see SECURITY.md for the private reporting path.
  - name: Discussions
    url: https://github.com/JordanNewell/crypto-key-classifier/discussions
    about: |
      Questions about usage, cross-chain recovery, or validator behavior —
      open a Discussion rather than an issue.
