name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pyright
        run: pyright || true  # advisory on CI; strict on dev box

      - name: Pytest
        run: pytest -v

  # End-to-end smoke test for the Pyodide demo (docs/demo/).
  # Required: was continue-on-error while the test bed was new; now gating PRs
  # after multiple green runs.
  demo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/demo/package.json

      - name: Start static server
        working-directory: docs/demo
        run: |
          python -m http.server 8000 --bind 127.0.0.1 &

      - name: Install + run smoke
        working-directory: tests/demo
        env:
          BASE_URL: http://127.0.0.1:8000/
        run: |
          npm install
          npx playwright install --with-deps chromium
          npm run smoke
