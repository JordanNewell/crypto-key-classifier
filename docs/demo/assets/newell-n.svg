<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" role="img" aria-label="NEWELL N mark">
  <!--
    NEWELL N logo — canonical construction per SSOT 2026-07-29.
    "Monoline vertical bars with rounded terminals. The white diagonal symbolizes connection and momentum."
    Do not: stretch, skew, bevel, outline, add gradients, change proportions.
  -->
  <rect width="100" height="120" fill="#0A0A0A"/>
  <!-- Left vertical bar -->
  <line x1="20" y1="20" x2="20" y2="100" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <!-- Right vertical bar -->
  <line x1="80" y1="20" x2="80" y2="100" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <!-- White diagonal — the "connection and momentum" signature -->
  <line x1="20" y1="20" x2="80" y2="100" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
</svg>
